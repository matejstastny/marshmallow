[package]
name = "marshmallow-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
image = "0.25"
libheif-rs = { version = "2", features = ["image"] }
kamadak-exif = "0.6"
fast_image_resize = "5"
lru = "0.18"
crossbeam-channel = "0.5"
fs4 = "0.9"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
turbojpeg = { version = "1.5.1", features = ["pkg-config"] }

[dev-dependencies]
tempfile = "3"
